name: flutterprojects
description: Glaucoma ACD Detection App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5+9

 #HTTP for Flask API
  http: ^1.2.1

  flutter_image_compress: ^2.3.0

  # Image path utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.1

  # UI extras
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.1
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true